name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Đặt tên APK theo phiên bản + số build + commit
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="DocTruyen-v${VER}-build${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/${NAME}.apk"
          echo "APK_NAME=${NAME}" >> "$GITHUB_ENV"

      # Artifact chỉ để thử nhanh, tự xoá sau 7 ngày; hết dung lượng thì không làm hỏng build
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.APK_NAME }}
          path: out/*.apk
          retention-days: 7

      # Lưu lâu dài ở Releases: không tính vào dung lượng Actions (0,5 GB)
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$APK_NAME" out/*.apk \
            --title "$APK_NAME" --target "$GITHUB_SHA" --prerelease \
            --notes "Build tự động #${GITHUB_RUN_NUMBER} từ commit $GITHUB_SHA (nhánh ${GITHUB_REF_NAME})"
