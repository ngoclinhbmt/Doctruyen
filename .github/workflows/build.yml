name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Đặt tên APK theo phiên bản + số build + commit
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="DocTruyen-v${VER}-build${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/${NAME}.apk"
          echo "APK_NAME=${NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: out/*.apk
